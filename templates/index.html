<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Banyak Foto ke GitHub - Folder FOTO</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 30px;
    width: 100%;
    max-width: 550px;
  }
  h1 {
    color: #333;
    font-size: 22px;
    margin-bottom: 6px;
    text-align: center;
  }
  .subtitle {
    color: #888;
    font-size: 13px;
    text-align: center;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #444;
    margin-bottom: 6px;
  }
  input, select {
    width: 100%;
    padding: 11px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 16px;
    transition: border 0.2s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #667eea;
  }
  input[type="file"] {
    padding: 8px;
    background: #f8f9ff;
    cursor: pointer;
  }
  button {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.2s;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 10px;
    font-size: 13px;
    text-align: center;
    display: none;
  }
  .success { background: #d4edda; color: #155724; display: block !important; }
  .error { background: #f8d7da; color: #721c24; display: block !important; }
  .info { background: #d1ecf1; color: #0c5460; display: block !important; }
  .preview-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0;
    max-height: 150px;
    overflow-y: auto;
  }
  .preview-thumb {
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 8px;
    display: none;
    border: 1px solid #ddd;
  }
  .result-box {
    margin-top: 16px;
    display: none;
    background: #f8f9fa;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #e0e0e0;
  }
  .result-box label {
    margin-bottom: 4px;
    font-size: 12px;
    color: #555;
  }
  .copy-wrapper {
    display: flex;
    gap: 8px;
  }
  .copy-wrapper input {
    margin-bottom: 0;
    background: #fff;
    font-size: 12px;
  }
  .copy-wrapper button {
    width: 110px;
    padding: 0;
    font-size: 13px;
  }
  .note {
    font-size: 11px;
    color: #999;
    text-align: center;
    margin-top: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📤 Upload Banyak Foto ke GitHub</h1>
  <p class="subtitle">File akan disimpan di folder <b>FOTO</b></p>

  <label>Token GitHub (Personal Access Token)</label>
  <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxx">

  <label>Username GitHub</label>
  <input type="text" id="username" placeholder="username-anda">

  <label>Nama Repository</label>
  <input type="text" id="repo" placeholder="nama-repo">

  <label>Pilih Banyak File / Foto</label>
  <input type="file" id="fileInput" multiple accept="image/*,application/pdf,.txt,.doc,.docx">
  <div id="previewContainer" class="preview-container"></div>

  <button id="uploadBtn">🚀 Upload Semua ke Folder FOTO</button>

  <div id="status"></div>

  <!-- Kotak Hasil Kumpulan Link Raw -->
  <div id="resultBox" class="result-box">
    <label>Kumpulan Link Raw (Dipisah Koma):</label>
    <div class="copy-wrapper">
      <input type="text" id="rawLinkOutput" readonly>
      <button id="copyBtn" type="button">Salin Semua</button>
    </div>
  </div>

  <p class="note">
    Token bisa dibuat di GitHub → Settings → Developer settings → Personal access tokens.<br>
    Pastikan token punya akses <b>repo</b> (contents: write).
  </p>
</div>

<script>
const FOLDER = "FOTO"; // <-- nama folder tujuan di repo GitHub

const fileInput = document.getElementById('fileInput');
const previewContainer = document.getElementById('previewContainer');
const statusEl = document.getElementById('status');
const uploadBtn = document.getElementById('uploadBtn');
const resultBox = document.getElementById('resultBox');
const rawLinkOutput = document.getElementById('rawLinkOutput');
const copyBtn = document.getElementById('copyBtn');

// Preview banyak gambar
fileInput.addEventListener('change', () => {
  previewContainer.innerHTML = '';
  resultBox.style.display = 'none';
  const files = fileInput.files;
  if (!files.length) return;

  Array.from(files).forEach(file => {
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement('img');
        img.src = e.target.result;
        img.className = 'preview-thumb';
        img.style.display = 'block';
        previewContainer.appendChild(img);
      };
      reader.readAsDataURL(file);
    }
  });
});

function showStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = type;
}

// Konversi file ke Base64
function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

uploadBtn.addEventListener('click', async () => {
  const token = document.getElementById('token').value.trim();
  const username = document.getElementById('username').value.trim();
  const repo = document.getElementById('repo').value.trim();
  const files = fileInput.files;

  if (!token || !username || !repo) {
    return showStatus('⚠️ Token, username, dan repo wajib diisi!', 'error');
  }
  if (!files.length) {
    return showStatus('⚠️ Pilih minimal satu file terlebih dahulu!', 'error');
  }

  uploadBtn.disabled = true;
  resultBox.style.display = 'none';
  let rawLinks = [];
  let successCount = 0;
  let failCount = 0;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    showStatus(`⏳ Mengunggah (${i + 1}/${files.length}): ${file.name}...`, 'info');

    try {
      const base64 = await toBase64(file);
      const path = `${FOLDER}/${file.name}`;
      const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;

      // Cek apakah file sudah ada (untuk ambil SHA)
      let sha = null;
      const checkRes = await fetch(apiUrl, {
        headers: { Authorization: `token ${token}` }
      });
      if (checkRes.ok) {
        const existing = await checkRes.json();
        sha = existing.sha;
      }

      // Upload / update file
      const body = {
        message: `Upload ${file.name} ke folder ${FOLDER}`,
        content: base64
      };
      if (sha) body.sha = sha;

      const res = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          Authorization: `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      if (res.ok) {
        successCount++;
        // Format Link Raw GitHub (gunakan 'main' atau sesuaikan jika 'master')
        const rawUrl = `https://raw.githubusercontent.com/${username}/${repo}/main/${FOLDER}/${file.name}`;
        rawLinks.push(rawUrl);
      } else {
        failCount++;
      }
    } catch (err) {
      failCount++;
    }
  }

  // Tampilkan status akhir dan hasil link jika ada yang berhasil
  if (successCount > 0) {
    showStatus(`✅ Berhasil mengunggah ${successCount} file! (${failCount} gagal)`, 'success');
    rawLinkOutput.value = rawLinks.join(','); // Digabung dengan tanda koma
    resultBox.style.display = 'block';
  } else {
    showStatus('❌ Gagal mengunggah semua file.', 'error');
  }

  uploadBtn.disabled = false;
});

// Fitur Salin Semua Link
copyBtn.addEventListener('click', () => {
  rawLinkOutput.select();
  rawLinkOutput.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(rawLinkOutput.value);
  
  copyBtn.textContent = 'Disalin! ✓';
  setTimeout(() => {
    copyBtn.textContent = 'Salin Semua';
  }, 2000);
});
</script>
</body>
</html>
