<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberCore - GitHub Multi-Uploader</title>
<style>
  :root {
    --bg-color: #0b0d19;
    --card-bg: rgba(18, 22, 41, 0.65);
    --accent-cyan: #00f3ff;
    --accent-purple: #9d4edd;
    --accent-pink: #ff007f;
    --text-primary: #f0f4f8;
    --text-secondary: #94a3b8;
    --input-bg: rgba(10, 14, 29, 0.8);
    --border-glow: rgba(0, 243, 255, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, -apple-system, sans-serif; }

  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    perspective: 1200px;
    overflow-x: hidden;
    position: relative;
  }

  /* Dynamic Animated Background Blobs for 3D Depth */
  body::before, body::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    z-index: -1;
    animation: float 10s infinite alternate ease-in-out;
  }
  body::before {
    width: 350px;
    height: 350px;
    background: var(--accent-cyan);
    top: 10%;
    left: 15%;
    opacity: 0.25;
  }
  body::after {
    width: 400px;
    height: 400px;
    background: var(--accent-purple);
    bottom: 10%;
    right: 15%;
    opacity: 0.3;
    animation-delay: -5s;
  }

  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(40px, 50px) scale(1.1); }
  }

  /* 3D Cyber Card Container */
  .container {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-top: 1px solid rgba(0, 243, 255, 0.4);
    border-left: 1px solid rgba(0, 243, 255, 0.2);
    border-radius: 24px;
    box-shadow: 
      0 30px 60px rgba(0, 0, 0, 0.8),
      inset 0 0 20px rgba(0, 243, 255, 0.05),
      0 0 40px rgba(0, 243, 255, 0.1);
    padding: 40px;
    width: 100%;
    max-width: 580px;
    transform-style: preserve-3d;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .container:hover {
    box-shadow: 
      0 35px 70px rgba(0, 0, 0, 0.9),
      inset 0 0 25px rgba(0, 243, 255, 0.1),
      0 0 50px rgba(0, 243, 255, 0.2);
  }

  /* Header Section */
  .header {
    text-align: center;
    margin-bottom: 30px;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1.5px;
    background: linear-gradient(135deg, #fff 0%, var(--accent-cyan) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 13px;
    letter-spacing: 0.5px;
  }
  .subtitle b {
    color: var(--accent-cyan);
    text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
  }

  /* Form Controls */
  .form-group {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 13px 16px;
    background: var(--input-bg);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: all 0.3s ease;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  }

  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--accent-cyan);
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 2px 4px rgba(0,0,0,0.5);
  }

  /* Custom 3D File Upload Area */
  .file-dropzone {
    position: relative;
    border: 2px dashed rgba(0, 243, 255, 0.3);
    background: rgba(10, 14, 29, 0.5);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .file-dropzone:hover {
    background: rgba(0, 243, 255, 0.05);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
  }

  input[type="file"] {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
  }

  .file-dropzone-text {
    font-size: 13px;
    color: var(--text-secondary);
    pointer-events: none;
  }

  .file-dropzone-text span {
    color: var(--accent-cyan);
    font-weight: bold;
  }

  /* Thumbnails Grid */
  .preview-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 12px;
    max-height: 140px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .preview-thumb {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border-radius: 10px;
    border: 1px solid var(--accent-cyan);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 10px rgba(0, 243, 255, 0.2);
    transition: transform 0.2s ease;
  }

  .preview-thumb:hover {
    transform: scale(1.1) translateZ(10px);
  }

  /* 3D Action Button */
  .btn-3d {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-purple) 100%);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    box-shadow: 0 8px 25px rgba(0, 243, 255, 0.3), 0 4px 0 #4a154b;
    transition: all 0.15s ease;
  }

  .btn-3d:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0, 243, 255, 0.5), 0 6px 0 #4a154b;
  }

  .btn-3d:active:not(:disabled) {
    transform: translateY(3px);
    box-shadow: 0 4px 15px rgba(0, 243, 255, 0.3), 0 1px 0 #4a154b;
  }

  .btn-3d:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* Status Messages */
  #status {
    margin-top: 20px;
    padding: 14px;
    border-radius: 12px;
    font-size: 13px;
    text-align: center;
    font-weight: 600;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  .success {
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid #10b981;
    color: #34d399;
    box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    display: block !important;
  }

  .error {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid #ef4444;
    color: #f87171;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
    display: block !important;
  }

  .info {
    background: rgba(0, 243, 255, 0.15);
    border: 1px solid var(--accent-cyan);
    color: var(--accent-cyan);
    box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
    display: block !important;
  }

  /* Result Output Section */
  .result-box {
    margin-top: 22px;
    display: none;
    background: rgba(10, 14, 29, 0.9);
    padding: 16px;
    border-radius: 14px;
    border: 1px solid rgba(0, 243, 255, 0.3);
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    animation: fadeIn 0.4s ease;
  }

  .copy-wrapper {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .copy-wrapper input {
    margin-bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    color: var(--accent-cyan);
    font-family: monospace;
    font-size: 12px;
  }

  .copy-btn {
    width: 120px;
    padding: 0;
    background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255, 0, 127, 0.3);
    transition: all 0.2s ease;
  }

  .copy-btn:hover {
    transform: scale(1.03);
    box-shadow: 0 6px 18px rgba(255, 0, 127, 0.5);
  }

  .note {
    font-size: 11px;
    color: var(--text-secondary);
    text-align: center;
    margin-top: 20px;
    line-height: 1.6;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Scrollbar Customization */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
  ::-webkit-scrollbar-thumb { background: var(--accent-cyan); border-radius: 4px; }
</style>
</head>
<body>

<div class="container" id="cardContainer">
  <div class="header">
    <h1>⚡ GITHUB UPLOADER</h1>
    <p class="subtitle">Penyimpanan Otomatis ke Folder <b>FOTO</b></p>
  </div>

  <div class="form-group">
    <label>Personal Access Token</label>
    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
  </div>

  <div class="form-group">
    <label>Username GitHub</label>
    <input type="text" id="username" placeholder="username-anda">
  </div>

  <div class="form-group">
    <label>Nama Repository</label>
    <input type="text" id="repo" placeholder="nama-repo">
  </div>

  <div class="form-group">
    <label>Pilih File / Banyak Foto</label>
    <div class="file-dropzone">
      <input type="file" id="fileInput" multiple accept="image/*,application/pdf,.txt,.doc,.docx">
      <div class="file-dropzone-text">
        📁 Klik atau seret file ke sini<br>
        <span>(Bisa pilih banyak foto)</span>
      </div>
    </div>
    <div id="previewContainer" class="preview-container"></div>
  </div>

  <button id="uploadBtn" class="btn-3d">🚀 UPLOAD SEKARANG</button>

  <div id="status"></div>

  <!-- Output Link Raw -->
  <div id="resultBox" class="result-box">
    <label>Kumpulan Link Raw (Dipisah Koma):</label>
    <div class="copy-wrapper">
      <input type="text" id="rawLinkOutput" readonly>
      <button id="copyBtn" class="copy-btn" type="button">Salin Semua</button>
    </div>
  </div>

  <p class="note">
    Token dapat dibuat melalui GitHub → Settings → Developer settings → Personal access tokens.<br>
    Pastikan token mengaktifkan izin <b>repo</b> (contents: write)[cite: 1].
  </p>
</div>

<script>
const FOLDER = "FOTO"; // Folder tujuan

const fileInput = document.getElementById('fileInput');
const previewContainer = document.getElementById('previewContainer');
const statusEl = document.getElementById('status');
const uploadBtn = document.getElementById('uploadBtn');
const resultBox = document.getElementById('resultBox');
const rawLinkOutput = document.getElementById('rawLinkOutput');
const copyBtn = document.getElementById('copyBtn');
const cardContainer = document.getElementById('cardContainer');

// Efek Tilt 3D pada Card saat Mouse Bergerak
document.addEventListener('mousemove', (e) => {
  const xAxis = (window.innerWidth / 2 - e.pageX) / 30;
  const yAxis = (window.innerHeight / 2 - e.pageY) / 30;
  cardContainer.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
});

// Preview Gambar Multi-File
fileInput.addEventListener('change', () => {
  previewContainer.innerHTML = '';
  resultBox.style.display = 'none';
  const files = fileInput.files;
  if (!files.length) return;

  Array.from(files).forEach(file => {
    if (file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement('img');
        img.src = e.target.result;
        img.className = 'preview-thumb';
        previewContainer.appendChild(img);
      };
      reader.readAsDataURL(file);
    }
  });
});

function showStatus(msg, type) {
  statusEl.textContent = msg;
  statusEl.className = type;
}

// Konversi File ke Base64
function toBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Proses Upload
uploadBtn.addEventListener('click', async () => {
  const token = document.getElementById('token').value.trim();
  const username = document.getElementById('username').value.trim();
  const repo = document.getElementById('repo').value.trim();
  const files = fileInput.files;

  if (!token || !username || !repo) {
    return showStatus('⚠️ Token, username, dan repo wajib diisi!', 'error');
  }
  if (!files.length) {
    return showStatus('⚠️ Pilih minimal satu file terlebih dahulu!', 'error');
  }

  uploadBtn.disabled = true;
  resultBox.style.display = 'none';
  let rawLinks = [];
  let successCount = 0;
  let failCount = 0;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    showStatus(`⏳ Mengunggah (${i + 1}/${files.length}): ${file.name}...`, 'info');

    try {
      const base64 = await toBase64(file);
      const path = `${FOLDER}/${file.name}`;
      const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${path}`;

      // Cek apakah file sudah ada
      let sha = null;
      const checkRes = await fetch(apiUrl, {
        headers: { Authorization: `token ${token}` }
      });
      if (checkRes.ok) {
        const existing = await checkRes.json();
        sha = existing.sha;
      }

      // Upload/update
      const body = {
        message: `Upload ${file.name} ke folder ${FOLDER}`,
        content: base64
      };
      if (sha) body.sha = sha;

      const res = await fetch(apiUrl, {
        method: 'PUT',
        headers: {
          Authorization: `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      });

      if (res.ok) {
        successCount++;
        const rawUrl = `https://raw.githubusercontent.com/${username}/${repo}/main/${FOLDER}/${file.name}`;
        rawLinks.push(rawUrl);
      } else {
        failCount++;
      }
    } catch (err) {
      failCount++;
    }
  }

  if (successCount > 0) {
    showStatus(`✅ Berhasil mengunggah ${successCount} file! (${failCount} gagal)`, 'success');
    rawLinkOutput.value = rawLinks.join(','); // Gabung dengan tanda koma
    resultBox.style.display = 'block';
  } else {
    showStatus('❌ Gagal mengunggah semua file.', 'error');
  }

  uploadBtn.disabled = false;
});

// Fitur Copy
copyBtn.addEventListener('click', () => {
  rawLinkOutput.select();
  rawLinkOutput.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(rawLinkOutput.value);
  
  copyBtn.textContent = 'Disalin! ✓';
  setTimeout(() => {
    copyBtn.textContent = 'Salin Semua';
  }, 2000);
});
</script>
</body>
</html>
